# Render.com Blueprint Configuration
# This file helps configure your service on Render

services:
  - type: web
    name: tripwise-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: tripwise-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: tripwise-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: tripwise-db
          property: password
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: "900000"
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: "2592000000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://tripwise-frontend.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None
      # Add logging configuration for debugging
      - key: LOGGING_LEVEL_ORG_FLYWAYDB
        value: DEBUG
      - key: LOGGING_LEVEL_COM_EXAMPLE_TRIPWISE_API_CONFIG
        value: DEBUG
      # Additional timeout and performance configurations
      - key: SERVER_TOMCAT_CONNECTION_TIMEOUT
        value: "60s"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "45000"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_TRANSACTION_DEFAULT_TIMEOUT
        value: "180"

databases:
  - name: tripwise-db
    databaseName: tripwise_db
    user: tripwise_user
    plan: free
