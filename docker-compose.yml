version: "3.9"
services:
  db:
    image: postgres:16
    container_name: TripWise-DB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 201461
      POSTGRES_DB: TripWise
    ports:
      - "5432:5432"
    volumes:
      - tripwise-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: tripwise-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://TripWise-DB:5432/TripWise
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 201461
    depends_on:
      - db

volumes:
  tripwise-db-data:
