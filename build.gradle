plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version '10.19.0'
    id "org.sonarqube" version "7.0.1.6134"
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'TripWise API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('flyway.version', '10.19.0')
}

configurations.configureEach {
	resolutionStrategy {
		force 'org.apache.commons:commons-lang3:3.18.0'
		force 'org.flywaydb:flyway-core:10.19.0'
		force 'org.flywaydb:flyway-database-postgresql:10.19.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	implementation 'org.flywaydb:flyway-core:10.19.0'
    implementation 'org.flywaydb:flyway-database-postgresql:10.19.0'
	implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport

	// Fix JVM warning about class sharing
	jvmArgs '-Xshare:off'

	// Additional JVM options for better test performance
	maxHeapSize = '1g'
	jvmArgs '-XX:+UseG1GC'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				minimum = 0.50
			}
		}
		rule {
			element = 'CLASS'
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
		rule {
			element = 'CLASS'
			excludes = [
				'com.example.tripwise_api.TripWiseApiApplication',
				'com.example.tripwise_api.dto.*',
				'com.example.tripwise_api.model.*',
				'com.example.tripwise_api.exception.*'
			]
		}
	}
}


flyway {
	url = 'jdbc:postgresql://localhost:5432/TripWise'
	user = 'postgres'
	password = '201461'
	schemas = ['public']
	locations = ['filesystem:src/main/resources/db/migration']
	baselineOnMigrate = true
}


sonar {
    properties {
        property "sonar.projectKey", "ruyi-group_s3-ip-tripwise-api"
        property "sonar.organization", "ruyi-group"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}