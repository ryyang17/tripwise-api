stages:
  - build
  - test
  - package
  - docker
  - deploy


variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_SHA

# Use Gradle cache to speed up builds
.cache-gradle: &cache-gradle
  cache:
    key: "gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - .gradle/
      - ~/.gradle/wrapper/
      - ~/.gradle/caches/

build:
  stage: build
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  script:
    - gradle --version
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 hour

test:
  stage: test
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml

package:
  stage: package
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  script:
    - ./gradlew bootJar
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour

# Build and push Docker image that will be used by docker-compose in deploy
docker-image:
  stage: docker
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - echo "Logging in to GitLab Container Registry"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: $CI_COMMIT_BRANCH

# Deploy with docker compose; assumes target runner has Docker and docker-compose
deploy:
  stage: deploy
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Pulling latest images"
    - docker pull postgres:16 || true
    - docker pull "$IMAGE_NAME:latest"
    - |
      if [ "$(docker ps -aq -f name=tripwise-app)" ]; then
        docker rm -f tripwise-app || true
      fi
      if [ "$(docker ps -aq -f name=TripWise-DB)" ]; then
        docker rm -f TripWise-DB || true
      fi
    - docker compose pull || true
    - docker compose up -d --force-recreate
    - docker compose ps
  needs:
    - job: docker-image
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
