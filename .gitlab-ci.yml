stages:
  - build
  - test
  - package
  - deploy


build:
  stage: build
  script:
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 hour

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml

package:
  stage: package
  script:
    - ./gradlew bootJar
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour

deploy:
  stage: deploy
  script:
    - docker build -t cddemo:latest .
    - if (docker ps -a -q -f name=cddemo) { docker stop cddemo }
    - if (docker ps -a -q -f name=cddemo) { docker rm cddemo }
    - docker run -d --name cddemo -p 8080:8080 cddemo:latest
  when: manual
  only:
    - main
