stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

# Gebruik Java 24 base image, en wrapper voor Gradle
image: eclipse-temurin:24

before_script:
  - chmod +x ./gradlew
  - ./gradlew --version

build-job:       # Build stage
  stage: build
  script:
    - echo "Compiling the code with Gradle..."
    - ./gradlew build -x test
    - echo "Compile complete."

unit-test-job:   # Unit tests
  stage: test
  script:
    - echo "Running unit tests..."
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/

lint-test-job:   # Lint check
  stage: test
  script:
    - echo "Linting code..."
    - ./gradlew check
    - echo "No lint issues found."

deploy-job:      # Deploy stage
  stage: deploy
  environment: production
  script:
    - echo "Deploying application..."
    # Hier zou je bv. docker build & push, of kubectl apply zetten
    - echo "Application successfully deployed."
