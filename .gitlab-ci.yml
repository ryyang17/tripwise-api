stages:
  - build
  - test
  - sonar
  - package
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_SHA

  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  SONAR_HOST_URL: "https://sonarcloud.io"
  SONAR_TOKEN: "88f108700914cb6f3255362703a97e6345f20278"
  SONAR_PROJECT_KEY: "ruyi-group_s3-ip-tripwise-api"
  SONAR_ORGANIZATION: "ruyi-group"

# Use Gradle cache to speed up builds
.cache-gradle: &cache-gradle
  cache:
    key: "gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - .gradle/
      - ~/.gradle/wrapper/
      - ~/.gradle/caches/

build:
  stage: build
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew --version
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/
      - build/classes/
    expire_in: 1 hour


unit-tests:
  stage: test
  image: gradle:8.10-jdk17
  before_script:
    - chmod +x ./gradlew
  script:
    - echo "Running all available tests..."
    - ./gradlew test -Dspring.profiles.active=test --no-daemon
    - echo "Generating test coverage report..."
    - ./gradlew jacocoTestReport --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/jacoco/test/jacocoTestReport.xml
      - build/test-results/test/TEST-*.xml
    reports:
      junit: build/test-results/test/TEST-*.xml
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false


integration-tests:
  stage: test
  image: gradle:8.10-jdk17
  variables:
    SPRING_PROFILES_ACTIVE: integration-test
  before_script:
    - chmod +x ./gradlew
  script:
    - echo "Running integration tests with in-memory H2 database..."
    - ./gradlew test --tests="*IntegrationTest" -Dspring.profiles.active=integration-test --no-daemon
    - echo "Generating integration test coverage report..."
    - ./gradlew jacocoTestReport --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/jacoco/test/jacocoTestReport.xml
      - build/reports/tests/test/
    reports:
      junit: build/test-results/test/TEST-*.xml
    expire_in: 3 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

# quality gate check with SonarCloud
sonarcloud-gradle-check:
  stage: sonar
  image: gradle:8.10-jdk17
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - .gradle/
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew sonarqube -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.organization=${SONAR_ORGANIZATION} -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.qualitygate.wait=true
  needs:
    - job: unit-tests
      artifacts: true
  rules:
    - when: always

package:
  stage: package
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew bootJar
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour

# Build and push Docker image that will be used by docker-compose in deploy
docker-image:
  stage: deploy
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - echo "Logging in to GitLab Container Registry"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  needs:
    - job: sonarcloud-gradle-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always

# Deploy with docker compose; assumes target runner has Docker and docker-compose
deploy:
  stage: deploy
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Pulling latest images"
    - docker pull postgres:16 || true
    - docker pull "$IMAGE_NAME:latest"
    - |
      if [ "$(docker ps -aq -f name=tripwise-app)" ]; then
        docker rm -f tripwise-app || true
      fi
      if [ "$(docker ps -aq -f name=TripWise-DB)" ]; then
        docker rm -f TripWise-DB || true
      fi
    - docker compose pull || true
    - docker compose up -d --force-recreate
    - docker compose ps
  needs:
    - job: docker-image
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: always
    - when: never
