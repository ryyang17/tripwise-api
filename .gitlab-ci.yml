stages:
  - build
  - test

image: gradle:8.4-jdk17

services:
  - postgres:15

variables:
  POSTGRES_DB: TripWise
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: 201461
  POSTGRES_HOST_AUTH_METHOD: trust
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x ./gradlew
  - ./gradlew --version

build-job:
  stage: build
  script:
    - echo "Compiling the code..."
    - ./gradlew assemble --info
    - echo "Compile complete."
  artifacts:
    expire_in: 1 hour
    paths:
      - build/libs/

unit-test-job:
  stage: test
  script:
    - echo "Running unit tests..."
    - ./gradlew test --info || true
    - echo "Tests completed."
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
      - build/test-results/

lint-test-job:
  stage: test
  script:
    - echo "Running code quality checks..."
    - ./gradlew check --info
    - echo "Linting complete."
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/
