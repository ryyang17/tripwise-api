stages:
  - build
  - test
  - package
  - docker
  - sonar
  - deploy

sonarcloud-check:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  rules:
    - when: always

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_SHA

  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  SONAR_HOST_URL: "https://sonarcloud.io"
  SONAR_TOKEN: "88f108700914cb6f3255362703a97e6345f20278"
  SONAR_PROJECT_KEY: "ruyi-group_s3-ip-tripwise-api"
  SONAR_ORGANIZATION: "ruyi-group"

# Use Gradle cache to speed up builds
.cache-gradle: &cache-gradle
  cache:
    key: "gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - .gradle/
      - ~/.gradle/wrapper/
      - ~/.gradle/caches/

build:
  stage: build
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew --version
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 hour

test:
  stage: test
  image: gradle:8.10-jdk17
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew test -Dspring.profiles.active=test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml

package:
  stage: package
  image: gradle:8.10-jdk17
  <<: *cache-gradle
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew bootJar
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour

# Build and push Docker image that will be used by docker-compose in deploy
docker-image:
  stage: docker
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - echo "Logging in to GitLab Container Registry"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always

# Deploy with docker compose; assumes target runner has Docker and docker-compose
deploy:
  stage: deploy
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Pulling latest images"
    - docker pull postgres:16 || true
    - docker pull "$IMAGE_NAME:latest"
    - |
      if [ "$(docker ps -aq -f name=tripwise-app)" ]; then
        docker rm -f tripwise-app || true
      fi
      if [ "$(docker ps -aq -f name=TripWise-DB)" ]; then
        docker rm -f TripWise-DB || true
      fi
    - docker compose pull || true
    - docker compose up -d --force-recreate
    - docker compose ps
  needs:
    - job: docker-image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

sonarcloud-gradle-check:
  stage: sonar
  image: gradle:8.10-jdk17
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew sonarqube \
      -Dsonar.projectKey=$SONAR_PROJECT_KEY \
      -Dsonar.organization=$SONAR_ORGANIZATION \
      -Dsonar.host.url=$SONAR_HOST_URL \
      -Dsonar.login=$SONAR_TOKEN
  rules:
    - when: always
