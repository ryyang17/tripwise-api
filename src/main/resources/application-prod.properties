# Production Configuration for TripWise API

# Server port configuration (Render uses PORT env variable)
server.port=${PORT:8080}

# Server timeout settings optimized for Render
server.tomcat.connection-timeout=60s
server.servlet.session.timeout=30m
server.tomcat.keep-alive-timeout=30s
server.tomcat.max-keep-alive-requests=100
server.tomcat.accept-count=100
server.tomcat.max-connections=200

# Cookie Security Configuration for Production
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:None}
cookie.domain=${COOKIE_DOMAIN:}

# CORS Configuration for Production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tripwise-frontend.onrender.com}

# Database configuration for production
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration for production
spring.flyway.url=${SPRING_DATASOURCE_URL:}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.locations=classpath:db/migration

# HikariCP connection pool settings for production (optimized for Render free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# HTTP Client timeout settings for production (increased for Render)
http.client.connection-timeout=30000
http.client.read-timeout=60000

# JPA settings for production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

# Transaction timeout configuration for production (increased for Render)
spring.transaction.default-timeout=180

# Flyway settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=true
spring.flyway.create-schemas=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

# Logging Configuration for Production
logging.level.com.example.tripwise_api.security=INFO
logging.level.com.example.tripwise_api.controller.AuthenticationController=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.flywaydb=${LOGGING_LEVEL_ORG_FLYWAYDB:INFO}
logging.level.com.example.tripwise_api.config=${LOGGING_LEVEL_COM_EXAMPLE_TRIPWISE_API_CONFIG:INFO}
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.root=INFO

# Custom logging pattern for better debugging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Disable H2 console in production
spring.h2.console.enabled=false

# Actuator endpoints - more restrictive in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
