# Production Configuration for TripWise API

# Cookie Security Configuration for Production
cookie.secure=true
cookie.same-site=Strict
cookie.domain=your-domain.com

# Database configuration for production
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Logging Configuration for Production
logging.level.com.example.tripwise_api.security=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.root=INFO

# Disable H2 console in production
spring.h2.console.enabled=false

# Actuator endpoints - more restrictive in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
