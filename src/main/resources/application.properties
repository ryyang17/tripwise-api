spring.application.name=TripWise API
server.port=8080
spring.h2.console.enabled=true

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TripWise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:201461}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Migrations ---
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TripWise}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:201461}
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Disable open-in-view
spring.jpa.open-in-view=false

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
