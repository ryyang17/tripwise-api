spring.application.name=TripWise API
server.port=8080
spring.h2.console.enabled=true

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TripWise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:201461}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Migrations ---
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TripWise}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:201461}
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Disable open-in-view
spring.jpa.open-in-view=false

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# JWT Configuration
jwt.secret=a8f5f167f44f4964e6c998dee827110c8fbba032fac56a8cfa18b73bb2d9cc55d2b5f9b5c2e8b8d7c8a9b3f2d1e0a4b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=2592000000

# Cookie Security Configuration
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}
cookie.domain=${COOKIE_DOMAIN:}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging Configuration
logging.level.com.example.tripwise_api.security=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
