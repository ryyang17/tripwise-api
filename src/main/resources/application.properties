spring.application.name=TripWise API
server.port=8080
spring.h2.console.enabled=true

# Database configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- Migrations ---
spring.flyway.url=jdbc:postgresql://localhost:5432/TripWise
spring.flyway.user=postgres
spring.flyway.password=201461
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
