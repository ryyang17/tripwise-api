spring.application.name=TripWise API
server.port=8080
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/TripWise
spring.datasource.username=postgres
spring.datasource.password=201461
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Migrations ---
spring.flyway.url=jdbc:postgresql://localhost:5432/TripWise
spring.flyway.user=postgres
spring.flyway.password=201461
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
