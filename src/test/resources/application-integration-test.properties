# Integration tests met H2 in-memory database

# H2 in-memory database configuratie
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP connection pool settings for integration tests
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate configuratie
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test configuratie
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=false

# Security & CORS configuratie voor tests
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Test JWT configuration
jwt.secret=zeTFH4atx2uP8Ok9tq1jrRVb/auwa5Swiuf1Yn3osk7iOVaiSbhXiXPNBV3lLp2/WfnwV8Z3znPHlKg4gtK9
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=2592000000

# Logging configuratie voor snellere tests
logging.level.com.example.tripwise_api=INFO
logging.level.org.springframework.test=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
