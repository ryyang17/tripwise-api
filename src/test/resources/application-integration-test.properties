# Integration tests met PostgreSQL database in GitLab CI

# PostgreSQL database configuratie
spring.datasource.url=jdbc:postgresql://postgres:5432/tripwise_integration_test
spring.datasource.username=test_user
spring.datasource.password=test_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuratie
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuratie
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Test configuratie
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=false

# Logging configuratie voor snellere tests
logging.level.com.example.tripwise_api=INFO
logging.level.org.springframework.test=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
