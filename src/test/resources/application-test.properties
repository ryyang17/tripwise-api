# Fast CI: use in-memory H2 in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Run Flyway against H2 so migrations are validated/applied
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Ensure schema is controlled by migrations
spring.jpa.hibernate.ddl-auto=none