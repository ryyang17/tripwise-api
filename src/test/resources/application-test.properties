# Test Profile Configuration

# In-memory H2 database voor tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP connection pool settings for tests
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate configuratie voor tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway configuration for tests
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=false

# Security & CORS configuration for tests
cors.allowed-origins=http://localhost:3000,http://localhost:5173


# Logging configuratie voor tests
logging.level.com.example.tripwise_api=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.flywaydb=DEBUG
